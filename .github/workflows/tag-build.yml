name: Build tagged artifact

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Windows executable
        run: >-
          docker buildx build
          --platform linux/amd64
          --build-arg TARGETOS=windows
          --build-arg TARGETARCH=amd64
          --output type=local,dest=dist
          .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: singlefile-companion-windows-amd64
          path: |
            dist/singlefile_companion.exe
            sfc.yml.example
            README.md
          if-no-files-found: error

      - name: Publish files to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(
            "dist/singlefile_companion.exe"
            "sfc.yml.example"
            "README.md"
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi
